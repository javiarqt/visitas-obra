<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actas de obra</title>
<style>
:root{--bg:#e9e7e2;--paper:#fff;--ink:#1d2733;--mute:#66707b;--line:#cfcbc2;--acc:#f2b705}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--paper:#1d242c;--ink:#e8e6e1;--mute:#98a1ab;--line:#35404b}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px)}
.bar{position:sticky;top:0;z-index:20;background:#1d2733;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center}
.bar b{font-size:15px}.bar small{opacity:.7;display:block;font-size:12px}
.bar select{margin-left:auto;max-width:50%;background:#2c3a49;color:#fff;border:0;padding:8px;border-radius:4px;font:inherit;font-size:14px;width:auto}
.prog{height:4px;background:#1d2733}.prog i{display:block;height:100%;background:var(--acc)}
main{max-width:760px;margin:0 auto;padding:14px 12px 100px}
.card{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--acc);padding:18px 16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:20px 0 4px}.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 3px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:10px}
textarea{min-height:100px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 14px;border-radius:4px;min-height:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.pri{background:var(--acc);border-color:var(--acc);color:#1d2733;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1}
.item{border:1px solid var(--line);padding:10px;margin-top:12px}
.item .hd{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--ink);font-size:15px}.ck input{width:22px;height:22px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.im{border:1px solid var(--line);padding:4px}.im img{width:100%;display:block;background:#fff}
.im .b{display:flex;gap:4px;margin-top:4px}.im .b button{flex:1;padding:4px;min-height:34px;font-size:13px}
.im input{margin-top:4px;padding:6px;font-size:13px}
.ov{position:fixed;inset:0;z-index:50;background:#111;display:flex;flex-direction:column}
.ov .tb{display:flex;flex-wrap:wrap;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:#1d2733}
.ov .tb button{color:#fff;border-color:#ffffff44;min-height:40px;padding:6px 10px}
.ov .tb .on{outline:3px solid var(--acc)}
.ov .cw{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.ov canvas{max-width:100%;max-height:100%;background:#fff;touch-action:none}
.msg{margin-top:12px;font-size:14px;color:var(--mute);min-height:20px}
.pbar{position:relative;height:30px;background:#d63c32;border-radius:4px;overflow:hidden;color:#fff;margin-top:8px}
.pbar i{display:block;height:100%;background:#2ea043}
.pbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.grp{margin-top:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{max-width:220px;max-height:80px;border:1px dashed var(--line);padding:6px;background:#fff;display:block;margin-top:8px}
.rc{display:flex;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0}.rc input{width:22px;height:22px}
</style>
</head>
<body>
<div class="bar"><div><b id="ttl"></b><small id="st"></small></div><select id="jump" aria-label="Ir a"></select></div>
<div class="prog"><i id="pg"></i></div>
<main><div class="card" id="app"></div></main>
<div class="nav" id="navb"><button id="bk">Atrás</button><button id="nx" class="pri">Siguiente</button></div>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="export.js"></script>
<script>
(function(){
var KD="actas-obra-dir-v1",KO="actas-obra-ob-v1",KL="actas-obra-logo-v1",KC="actas-obra-cur-v1";
var ROLES=["Propiedad","Constructor","Arquitecto","Arquitecto técnico"];
var STEPS=["Datos de la obra","Asistentes","Revisión del acta anterior","Temas tratados","Planificación de las obras","Control de calidad","Seguridad y salud","Información económica","Próxima visita","Fotos","Documentos anexos","Acta final"];
var VIEWS={actas:"Actas guardadas",obras:"Obras",dir:"Intervinientes"};
var $=function(i){return document.getElementById(i)};
function ls(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lw(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var DIR=ls(KD,[]),OB=ls(KO,[]),ACTS=[],S,step=0,mode="steps",msg="",flt="",tmr,DB;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
DIR.forEach(function(d){if(!d.id)d.id=uid();if(!d.ps)d.ps=[]});OB.forEach(function(o){if(!o.id)o.id=uid();if(o.proy==null)o.proy=""});
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ---- almacenamiento (IndexedDB) ---- */
function dbOpen(){return new Promise(function(res){try{var r=indexedDB.open("actas-obra-db",1);r.onupgradeneeded=function(){r.result.createObjectStore("actas",{keyPath:"id"})};r.onsuccess=function(){DB=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})}
function dbAll(){return new Promise(function(res){if(!DB)return res([]);var q=DB.transaction("actas").objectStore("actas").getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}})}
function dbPut(o){try{DB&&DB.transaction("actas","readwrite").objectStore("actas").put(o)}catch(e){}}
function dbDel(id){try{DB&&DB.transaction("actas","readwrite").objectStore("actas").delete(id)}catch(e){}}
function flush(){clearTimeout(tmr);if(!S)return;S.upd=Date.now();if(ACTS.indexOf(S)<0)ACTS.push(S);dbPut(S);lw(KC,S.id);$("st").textContent="Acta guardada"}
function save(){clearTimeout(tmr);tmr=setTimeout(flush,400)}
document.addEventListener("visibilitychange",function(){if(document.hidden)flush()});

/* ---- modelo ---- */
function blank(prev){
 var o=prev||{},pend=[];
 if(prev){(prev.pend||[]).forEach(function(p){if(p.est==="Pendiente")pend.push({t:p.t,from:p.from,est:"Pendiente",nota:""})});
  (prev.temas||[]).forEach(function(t){var tx=[t.t].concat((t.img||[]).filter(function(m){return m.as==="txt"&&m.txt}).map(function(m){return m.txt})).filter(function(x){return x&&x.trim()}).join("\n");if(tx)pend.push({t:tx,from:prev.num,est:"Pendiente",nota:""})})}
 return{id:uid(),num:prev?(+prev.num||0)+1:1,obraId:o.obraId||"",obra:o.obra||"",ubi:o.ubi||"",docs:[],prop:o.prop||"",proy:o.proy||"",dir:o.dir||"",fecha:new Date().toISOString().slice(0,10),
  att:o.att?o.att.map(function(a){return{r:a.r,n:a.n,e:a.e,t:a.t,m:a.m,ok:true}}):ROLES.map(function(r){return{r:r,n:"",e:"",t:"",m:"",ok:true}}),
  aprob:"Pendiente",pend:pend,temas:[{t:"",img:[]}],plan:"",cc:"",ss:"",eco:"",pres:o.pres||"",cert:o.cert||"",prox:"",proxf:"",proxh:"",fotos:[],upd:Date.now()}
}
function latest(obraId,not){var l=ACTS.filter(function(a){return a.obraId&&a.obraId===obraId&&a.id!==not});l.sort(function(a,b){return(b.num-a.num)||(b.upd-a.upd)});return l[0]}
function fresh(s){return!s.temas.some(function(t){return t.t||t.img.length})&&!s.pend.length&&!s.plan&&!s.cc&&!s.ss&&!s.eco&&!s.fotos.length}
function newFrom(prev){flush();S=blank(prev);ACTS.push(S);if(S.obraId)mergeGroup(S.obraId);flush();step=0;mode="steps";msg="";render();window.scrollTo(0,0)}

function mergeGroup(id){var l=DIR.filter(function(d){return(d.ps||[]).indexOf(id)>=0});if(!l.length)return 0;
 var have={};S.att.forEach(function(a){if(a.n)have[a.n]=1});var add=l.filter(function(d){return!have[d.n]});
 if(add.length)S.att=S.att.filter(function(a){return a.n||a.t||a.m}).concat(add.map(function(d){return{r:d.r||"",n:d.n,e:d.e||"",t:d.t||"",m:d.m||"",ok:true}}));
 save();return add.length}
function grpBlock(){if(!OB.length)return'<p class="sub">Crea obras y asigna intervinientes en el menú Obras para añadirlos de golpe.</p>';
 return'<div class="item"><label>Añadir todos los intervinientes de un proyecto</label><select id="grpsel">'+OB.map(function(o){return'<option value="'+o.id+'"'+(o.id===S.obraId?" selected":"")+'>'+esc((o.proy?o.proy+" · ":"")+(o.obra||"(sin nombre)"))+'</option>'}).join("")+'</select><div class="acts"><button class="pri" data-a="addgrp">Añadir todos</button></div></div>'}
function xObra(o){return'<label>Intervinientes de esta obra</label>'+(DIR.length?DIR.map(function(d){return'<label class="ck"><input type="checkbox" data-g="'+d.id+'|'+o.id+'"'+((d.ps||[]).indexOf(o.id)>=0?" checked":"")+'>'+esc(d.n||"(sin nombre)")+(d.r?" ("+esc(d.r)+")":"")+'</label>'}).join(""):'<p class="sub">Primero añade intervinientes.</p>')}
function xDir(d){return'<label>Obras en las que participa</label>'+(OB.length?OB.map(function(o){return'<label class="ck"><input type="checkbox" data-g="'+d.id+'|'+o.id+'"'+((d.ps||[]).indexOf(o.id)>=0?" checked":"")+'>'+esc((o.proy?o.proy+" · ":"")+(o.obra||"(sin nombre)"))+'</label>'}).join(""):'<p class="sub">Primero añade obras.</p>')}
function docsStep(){var h='<h1>Documentos anexos</h1><p class="sub">Añade planos, certificaciones u otros documentos (PDF o imagen). Se incluyen al final del acta.</p>';
 S.docs.forEach(function(d,i){h+='<div class="item"><div class="hd"><span>Anexo '+(i+1)+' · '+(d.type==="pdf"?"PDF":"Imagen")+' · '+Math.round(d.size/1024)+' KB</span><button data-a="deldoc" data-i="'+i+'">Quitar</button></div><input data-p="docs.'+i+'.name" value="'+esc(d.name)+'"></div>'});
 if(!S.docs.length)h+='<p class="sub">Todavía no hay documentos.</p>';
 return h+'<div class="acts"><button class="pri" data-a="adddoc">Añadir documento</button></div><p class="msg" id="msg">'+esc(msg)+'</p><p class="sub">En el Word, los PDF solo se listan: se adjuntan completos en el PDF del acta.</p>'}
function addDocs(){var f=document.createElement("input");f.type="file";f.accept="application/pdf,image/*";f.multiple=true;
 f.onchange=function(){Array.prototype.forEach.call(f.files,function(file){
  if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
   if(file.size>20*1024*1024){setMsg("«"+file.name+"» pesa más de 20 MB.");return}
   var r=new FileReader();r.onload=function(){S.docs.push({name:file.name,type:"pdf",d:r.result,size:file.size});save();render()};r.readAsDataURL(file)}
  else if(/^image\//.test(file.type)){var u=URL.createObjectURL(file),im=new Image();
   im.onload=function(){var s=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    var d=c.toDataURL("image/jpeg",.82);S.docs.push({name:file.name,type:"img",d:d,w:c.width,h:c.height,size:Math.round(d.length*.75)});save();render()};im.src=u}
  else setMsg("Formato no admitido: "+file.name+" (solo PDF o imagen).")})};f.click()}
function inkLines(st){var B={};st.forEach(function(s){if(!s.length)return;var c=0;s.forEach(function(q){c+=q[1]});c/=s.length;var k=Math.floor(c/80);(B[k]=B[k]||[]).push(s)});
 return Object.keys(B).map(Number).sort(function(a,b){return a-b}).map(function(k){return B[k].sort(function(a,b){return a[0][2]-b[0][2]})})}
function recog(m){var C=window.Capacitor,P=C&&C.Plugins&&C.Plugins.InkRecognizer;
 if(!Exp.isNative()||!P){alert("La conversión a texto solo está disponible en la app de Android.");return}
 if(!m.ink||!m.ink.length){alert("Este bloque no tiene trazos que leer.");return}
 $("st").textContent="Leyendo escritura…";
 P.recognize({lang:"es",width:1000,height:700,lines:inkLines(m.ink)}).then(function(r){var t=(r.lines||[]).join("\n").trim();
  if(!t){alert("No se ha podido leer ningún texto.");$("st").textContent="";return}
  m.txt=t;m.as="txt";save();render()}).catch(function(e){$("st").textContent="";alert("No se pudo convertir: "+(e&&e.message||e))})}
function inkBlock(m,p,j){var t=m.as==="txt",a='data-p="'+p+'" data-j="'+j+'"';
 return'<div class="im" style="grid-column:1/-1">'+(t?'<textarea data-p="'+p+'.'+j+'.txt">'+esc(m.txt)+'</textarea>':'<img alt="Escritura a mano" src="'+m.d+'">')+
 '<div class="b"><button data-a="inkimg" '+a+(t?'':' class="pri"')+'>Manuscrito</button><button data-a="inktxt" '+a+(t?' class="pri"':'')+'>Texto</button>'+(t?'<button data-a="inkre" '+a+'>Releer</button>':'')+'<button data-a="del" '+a+'>Quitar</button></div></div>'}
function get(p){return p.split(".").reduce(function(o,k){return o==null?"":o[k]},S)}
function set(p,v){var a=p.split("."),o=S;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
function F(l,p,t){return'<label>'+l+'</label><input type="'+(t||"text")+'"'+(t==="number"?' step="any" inputmode="decimal"':"")+' data-p="'+p+'" value="'+esc(get(p))+'">'}
function A(l,p,ph){return'<label>'+l+'</label><textarea data-p="'+p+'" placeholder="'+esc(ph||"")+'">'+esc(get(p))+'</textarea>'}
function imgs(p,cap){var h='<div class="imgs">';
 get(p).forEach(function(m,j){if(m.ink){h+=inkBlock(m,p,j);return}h+='<div class="im"><img alt="Imagen '+(j+1)+'" src="'+m.d+'"><div class="b"><button data-a="draw" data-p="'+p+'" data-j="'+j+'">Dibujar</button><button data-a="del" data-p="'+p+'" data-j="'+j+'">Quitar</button></div>'+(cap?'<input data-p="'+p+'.'+j+'.c" placeholder="Pie de foto" value="'+esc(m.c)+'">':'')+'</div>'});
 return h+'</div>'}
function btns(p){return'<div class="acts"><button class="pri" data-a="wr" data-p="'+p+'">Escribir con lápiz</button><button data-a="sk" data-p="'+p+'">Croquis</button><button data-a="cam" data-p="'+p+'">Hacer foto</button><button data-a="gal" data-p="'+p+'">Galería</button></div>'}
function barInner(){var e=Exp.econ(S);if(!(e.pres>0))return'<p class="sub">Introduce el presupuesto para ver el porcentaje de obra.</p>';
 return'<div class="pbar"><i style="width:'+e.pct+'%"></i><b>'+Exp.pc(e.raw)+' realizado</b></div><p class="sub" style="margin-top:6px">Pendiente: '+Exp.pc(Math.max(0,100-e.raw))+' · Certificado '+Exp.eur(e.cert)+' de '+Exp.eur(e.pres)+'</p>'}

/* ---- vistas ---- */
function obraSel(){return'<label>Obra guardada</label><select data-pickobra="1"><option value="">Elegir…</option>'+OB.map(function(o,k){return'<option value="'+k+'"'+(o.id===S.obraId?" selected":"")+'>'+esc(o.obra||"(sin nombre)")+'</option>'}).join("")+'</select>'}
function step0(){return'<h1>Datos de la obra</h1><p class="sub">Elige una obra guardada o escribe los datos y guárdalos.</p>'+obraSel()+F("Acta nº","num","number")+F("Obra","obra")+F("Nº de proyecto","proy")+F("Ubicación","ubi")+F("Propiedad","prop")+F("Dirección facultativa","dir")+F("Fecha","fecha","date")+'<div class="acts"><button data-a="todb">Guardar en mis obras</button></div>'}
function step1(){var h='<h1>Asistentes</h1><p class="sub">Elige del directorio o escribe a mano. Marca quién asiste.</p>'+grpBlock();
 S.att.forEach(function(a,i){h+='<div class="item"><div class="hd"><span>'+esc(a.r||"Asistente")+'</span><button data-a="delatt" data-i="'+i+'">Quitar</button></div>'+
  '<label>Elegir del directorio</label><select data-pick="'+i+'"><option value="">Elegir…</option>'+DIR.map(function(d,k){return'<option value="'+k+'">'+esc(d.n)+(d.r?" ("+esc(d.r)+")":"")+'</option>'}).join("")+'</select>'+
  '<div class="two"><div><label>Rol</label><input data-p="att.'+i+'.r" value="'+esc(a.r)+'"></div><div><label>Nombre</label><input data-p="att.'+i+'.n" value="'+esc(a.n)+'"></div><div><label>Empresa</label><input data-p="att.'+i+'.e" value="'+esc(a.e)+'"></div><div><label>Teléfono</label><input type="tel" data-p="att.'+i+'.t" value="'+esc(a.t)+'"></div></div>'+
  '<label>Correo electrónico</label><input type="email" data-p="att.'+i+'.m" value="'+esc(a.m)+'"><label class="ck"><input type="checkbox" data-c="att.'+i+'.ok"'+(a.ok?" checked":"")+'>Asiste a la visita</label>'+
  (a.n&&!DIR.some(function(d){return d.n===a.n})?'<div class="acts"><button data-a="todir" data-i="'+i+'">Guardar en directorio</button></div>':'')+'</div>'});
 return h+'<div class="acts"><button class="pri" data-a="addatt">Añadir asistente</button></div>'}
function step2(){var h='<h1>Revisión del acta anterior</h1><label>¿Se aprueba el acta anterior?</label><select data-p="aprob">'+["Pendiente","Sí, aprobada","Aprobada con cambios","No aprobada"].map(function(o){return'<option'+(S.aprob===o?" selected":"")+'>'+o+'</option>'}).join("")+'</select>'+
 '<h2>Puntos pendientes</h2><p class="sub">Los temas del acta anterior aparecen aquí. Decide cada punto por separado.</p>';
 if(!S.pend.length)h+='<p class="sub">No hay puntos pendientes.</p>';
 S.pend.forEach(function(p,i){h+='<div class="item"><div class="hd"><span>'+(p.from?"Acta nº "+esc(p.from):"Añadido a mano")+'</span><button data-a="delpend" data-i="'+i+'">Quitar</button></div><textarea data-p="pend.'+i+'.t">'+esc(p.t)+'</textarea><label>Decisión</label><select data-p="pend.'+i+'.est">'+["Pendiente","Resuelto","Descartado"].map(function(o){return'<option'+(p.est===o?" selected":"")+'>'+o+'</option>'}).join("")+'</select><label>Comentario</label><input data-p="pend.'+i+'.nota" value="'+esc(p.nota)+'"></div>'});
 return h+'<div class="acts"><button class="pri" data-a="addpend">Añadir punto</button></div>'}
function step3(){var h='<h1>Temas tratados</h1><p class="sub">Escribe con teclado o con lápiz digital. Tras escribir a mano, elige «Manuscrito» (queda como imagen) o «Texto» (se lee y convierte). Los temas pasarán como pendientes a la próxima acta.</p>';
 S.temas.forEach(function(t,i){h+='<div class="item"><div class="hd"><span>Tema '+(i+1)+'</span><button data-a="deltema" data-i="'+i+'">Quitar tema</button></div><textarea data-p="temas.'+i+'.t" placeholder="Escribe el tema o acuerdo">'+esc(t.t)+'</textarea>'+imgs("temas."+i+".img")+btns("temas."+i+".img")+'</div>'});
 return h+'<div class="acts"><button class="pri" data-a="addtema">Añadir tema</button></div>'}
function step8(){var h='<h1>Próxima visita</h1>'+F("Fecha","proxf","date")+F("Hora","proxh","time")+F("O escríbelo libremente (sustituye a lo anterior)","prox")+
 '<h2>Enviar el acta</h2><p class="sub">Elige destinatarios. En el móvil se abre el menú de compartir con el PDF adjunto; en el ordenador se abre WhatsApp Web o tu correo y se descarga el PDF.</p>';
 var any=false;S.att.forEach(function(a,i){if(!a.n)return;any=true;h+='<label class="rc"><input type="checkbox" data-c="att.'+i+'.send"'+(a.send!==false?" checked":"")+'><span>'+esc(a.n)+'<br><small>'+esc([a.t,a.m].filter(Boolean).join(" · ")||"sin teléfono ni correo")+'</small></span></label>'});
 if(!any)h+='<p class="sub">Añade asistentes con nombre para elegir destinatarios.</p>';
 return h+'<div class="acts"><button class="pri" data-a="wa">Enviar por WhatsApp</button><button class="pri" data-a="mail">Enviar por email</button></div><p class="msg" id="msg">'+esc(msg)+'</p>'}
